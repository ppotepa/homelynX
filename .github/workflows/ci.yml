name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/TorrentBot2.sln

      - name: Build
        run: dotnet build src/TorrentBot2.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/TorrentBot2.sln --configuration Release --no-build --verbosity normal
