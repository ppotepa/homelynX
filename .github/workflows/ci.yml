name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/TorrentBot2.sln

      - name: Build
        run: dotnet build src/TorrentBot2.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/TorrentBot2.sln --configuration Release --no-build --verbosity normal

      - name: Repository hygiene
        run: |
          python3 -m py_compile scripts/media_organizer.py
          python3 scripts/check_encoding.py
          python3 scripts/check_file_limits.py
          python3 scripts/check_no_default_secrets.py
          python3 scripts/check_no_runtime_data.py
          bash scripts/verify-arch-docs.sh
          if rg -n -i 'services/portal|portal\.sh|smoke_imports|llm_prompt|ollama|LlmUsage|LLM_URL|LLM_HOST' \
            README.md docs scripts e2e-tests src Dockerfile docker-compose.yaml docker-compose.dev.yaml docker-compose.e2e.yaml install.sh; then
            echo 'Removed legacy portal/LLM references found.' >&2
            exit 1
          fi

  native-chiptune:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Furnace renderer
        run: docker build --target furnace-build -t homelynx-furnace-test .

      - name: Extract renderer
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create homelynx-furnace-test)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/homelynx-chiptune-renderer" /tmp/homelynx-chiptune-renderer
          chmod +x /tmp/homelynx-chiptune-renderer

      - name: Verify native audio profiles
        run: scripts/verify-chiptune-furnace.sh /tmp/homelynx-chiptune-renderer

      - name: Verify dense MIDI automation
        run: bash scripts/verify-chiptune-dense-automation.sh /tmp/homelynx-chiptune-renderer

      - name: Verify semantic instrument bank
        run: bash scripts/verify-chiptune-instrument-bank.sh /tmp/homelynx-chiptune-renderer
