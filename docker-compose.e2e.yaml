# E2E overlay: isolated test endpoint on localhost only (not for production).
services:
  homelynx-bot:
    ports:
      - "127.0.0.1:${TORRENTBOT_TEST_ENDPOINT_PORT:-5000}:5000"
    environment:
      TORRENTBOT_ENABLE_TEST_ENDPOINT: "true"
      TORRENTBOT_TEST_ENDPOINT_SECRET: "${TORRENTBOT_TEST_ENDPOINT_SECRET:?TORRENTBOT_TEST_ENDPOINT_SECRET is required for e2e}"