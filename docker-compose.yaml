name: homelynx

services:
  homelynx-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homelynx-bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_ALLOWED_USERS_FILE: "/app/allowed-users.cfg"
      ACL_PRESETS_FILE: "/app/acl/presets.cfg"
      TORRENTBOT_ACL_FILE: "/app/allowed-users.cfg"
      TORRENTBOT_ENABLE_TEST_ENDPOINT: "${TORRENTBOT_ENABLE_TEST_ENDPOINT:-false}"
      TORRENTBOT_TEST_ENDPOINT_SECRET: "${TORRENTBOT_TEST_ENDPOINT_SECRET:-}"
      TORRENTBOT_MEDIA_ROOT: "/media"
      TORRENTBOT_AUDIT_DB: "${HOMELYNX_AUDIT_DB:-/data/audit/homelynx.db}"
      TORRENTBOT_TOOLS_DB: "${HOMELYNX_TOOLS_DB:-/data/tools/homelynx-tools.db}"
      HOMELYNX_CAPABILITIES_FILE: "/data/capabilities.json"
      TORRENTBOT_SHORTENER_ENABLED: "${TORRENTBOT_SHORTENER_ENABLED:-false}"
      TORRENTBOT_SHORTENER_BASE_URL: "${TORRENTBOT_SHORTENER_BASE_URL:-http://localhost:8089}"
      TORRENTBOT_SHORTENER_BIND_URL: "http://0.0.0.0:8089"
      AFTERSHIP_API_KEY: "${AFTERSHIP_API_KEY:-}"
      PLAYWRIGHT_EXECUTABLE_PATH: "/usr/bin/chromium"
      TORRENTBOT_MAP_TILE_URL: "${TORRENTBOT_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}"
      TORRENTBOT_MAP_TILE_CACHE: "/data/tools/map-tiles"

      QBIT_HOST: "qbittorrent"
      QBIT_PORT: "8080"
      QBIT_USERNAME: "${QBIT_USERNAME:-admin}"
      QBIT_PASSWORD: "${QBIT_PASSWORD:?QBIT_PASSWORD is required. Run ./install.sh to generate it.}"
      QBIT_HTTPS: "false"

      JACKETT_HOST: "jackett"
      JACKETT_PORT: "9117"
      JACKETT_API_KEY: "${JACKETT_API_KEY}"
      JACKETT_HTTPS: "false"
      JACKETT_SEARCH_INDEXERS: "${JACKETT_SEARCH_INDEXERS:-all}"

      DOWNLOAD_PATH: "${DOWNLOAD_PATH:-/downloads}"
      MEDIA_LIBRARY_PATH: "${MEDIA_LIBRARY_PATH:-/media}"
      MEDIA_DOWNLOAD_MAX_DURATION_SECONDS: "${MEDIA_DOWNLOAD_MAX_DURATION_SECONDS:-14400}"
      MEDIA_DOWNLOAD_TEMP_DIR: "/downloads/incomplete/media"
      YTDLP_COOKIES_FILE: "${YTDLP_COOKIES_FILE:-/app/cookies/facebook.txt}"
      MEDIA_TELEGRAM_MAX_BYTES: "${MEDIA_TELEGRAM_MAX_BYTES:-47185920}"
    volumes:
      - "${HOST_DOWNLOAD_PATH:-./downloads}:/downloads"
      - "${MEDIA_LIBRARY_PATH:-./media}:/media"
      - "./allowed-users.cfg:/app/allowed-users.cfg:ro"
      - "./acl/presets.cfg:/app/acl/presets.cfg:ro"
      - "./data:/data"
      - "./cookies:/app/cookies:ro"
      - "./logs:/app/logs"
    ports:
      - "${SHORTENER_PORT:-8089}:8089"
    depends_on:
      - qbittorrent
      - jackett
      - flaresolverr
    # Avoid network-level YouTube Restricted Mode DNS aliases such as
    # restrictmoderate.youtube.com, which prevent public media downloads.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - homelynx

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Warsaw}
      - WEBUI_PORT=8080
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6881:6881"
      - "127.0.0.1:6881:6881/udp"
    volumes:
      - "${HOST_DOWNLOAD_PATH:-./downloads}:/downloads"
      - "${MEDIA_LIBRARY_PATH:-/home/ppotepa/mediaserver}:/media"
      - "${QBIT_CONFIG_PATH:-./qbittorrent-config}:/config"
    networks:
      - homelynx

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Warsaw}
    ports:
      - "127.0.0.1:${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - "${JELLYFIN_CONFIG_PATH:-./jellyfin-config}:/config"
      - "${HOST_DOWNLOAD_PATH:-./downloads}:/data/downloads:ro"
      - "${MEDIA_LIBRARY_PATH:-/home/ppotepa/mediaserver}:/media:ro"
    networks:
      - homelynx

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Warsaw}
      - AUTO_UPDATE=true
    ports:
      - "127.0.0.1:9117:9117"
    volumes:
      - "${JACKETT_CONFIG_PATH:-./jackett-config}:/config"
      - "${HOST_DOWNLOAD_PATH:-./downloads}:/downloads"
    networks:
      - homelynx

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Europe/Warsaw}
    ports:
      - "127.0.0.1:8191:8191"    # FlareSolverr Web API
    networks:
      - homelynx

networks:
  homelynx:
    name: homelynx
